
services:
  # --------------------------
  # MySQL
  # --------------------------
  mysql:
    image: mysql:8.0
    container_name: coffee-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: coffee
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - kafka-net

  # --------------------------
  # Broker 1 (Node ID: 1) - 활성화
  # --------------------------
  kafka-1:
    image: apache/kafka:3.7.0
    container_name: kafka-1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 단일 브로커라 1번만 voters에 등록 / 브로커 추가시 수정
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093

      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # 단일 브로커라 replication factor 1로 변경 / 브로커 추가시 수정
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka1_data:/var/lib/kafka/data
    networks:
      - kafka-net

  # --------------------------
  # Broker 2 (Node ID: 2) - 비활성화
  # --------------------------
  #  kafka-2:
  #    image: apache/kafka:3.7.0
  #    container_name: kafka-2
  #    ports:
  #      - "9093:9092"
  #    environment:
  #      KAFKA_NODE_ID: 2
  #      KAFKA_PROCESS_ROLES: broker,controller
  #      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  #      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092
  #      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://localhost:9093
  #      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  #      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  #      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  #      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  #      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  #      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  #      KAFKA_LOG_DIRS: /var/lib/kafka/data
  #    volumes:
  #      - kafka2_data:/var/lib/kafka/data
  #    networks:
  #      - kafka-net

  # --------------------------
  # Broker 3 (Node ID: 3) - 비활성화
  # --------------------------
  #  kafka-3:
  #    image: apache/kafka:3.7.0
  #    container_name: kafka-3
  #    ports:
  #      - "9094:9092"
  #    environment:
  #      KAFKA_NODE_ID: 3
  #      KAFKA_PROCESS_ROLES: broker,controller
  #      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  #      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092
  #      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://localhost:9094
  #      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  #      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  #      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  #      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  #      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  #      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  #      KAFKA_LOG_DIRS: /var/lib/kafka/data
  #    volumes:
  #      - kafka3_data:/var/lib/kafka/data
  #    networks:
  #      - kafka-net

  # --------------------------
  # Kafka UI
  # --------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kraft-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092
      KAFKA_CLUSTERS_0_METADATAPROVIDER: "KAFKA"
      DYNAMIC_CONFIG_ENABLED: true
    depends_on:
      - kafka-1
    networks:
      - kafka-net

  # --------------------------
  # Redis
  # --------------------------
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - kafka-net

  # --------------------------
  # RedisInsight
  # --------------------------
  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    depends_on:
      - redis
    networks:
      - kafka-net

  # --------------------------
  # Spring Boot App 1
  # --------------------------
  app-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cafe-app-1
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_NAME: app-1
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/coffee
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      - mysql
      - kafka-1
      - redis
    networks:
      - kafka-net

  # --------------------------
  # Spring Boot App 2
  # --------------------------
  app-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cafe-app-2
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_NAME: app-2
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/coffee
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      - mysql
      - kafka-1
      - redis
    networks:
      - kafka-net

  # --------------------------
  # Nginx
  # --------------------------
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app-1
      - app-2
    networks:
      - kafka-net

  # --------------------------
  # K6
  # --------------------------
  k6:
    image: grafana/k6:latest
    container_name: k6
    volumes:
      - ./infra/k6:/scripts
    networks:
      - kafka-net
    depends_on:
      - nginx

volumes:
  mysql_data:
  kafka1_data:
  # kafka2_data:
  # kafka3_data:
  redis_data:

networks:
  kafka-net:
    driver: bridge